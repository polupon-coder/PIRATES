<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIRATAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏴‍☠️</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="title-img" src="img/titulo-es.webp" alt="Piratas"></div>
    <div id="status" class="status"></div>
    <button id="pricesBtn" class="top-btn hidden" title="Precios"><img src="img/balanza.webp" alt=""></button>
    <button id="rulesBtn" class="top-btn" title="Reglas">R</button>
    <button id="langBtn" class="top-btn lang-btn" aria-label="Idioma / Language"></button>
    <button id="soundBtn" class="top-btn icon" title="Silenciar sonidos" aria-label="Sonido"></button>
    <span id="roomInfo" class="room-code"></span>
  </header>

  <main id="cover" class="cover hidden">
    <img class="cover-title title-img" src="img/titulo-es.webp" alt="Piratas">
    <button id="playBtn" class="btn gold big cover-play">Jugar</button>
    <p id="coverBy" class="cover-by">Un juego de Pol Lupon</p>
  </main>

  <main id="home" class="home hidden">
    <div class="home-card parchment">
      <h1 class="home-title"><img class="title-img" src="img/titulo-es.webp" alt="Piratas"></h1>
      <input id="nameInput" class="input" maxlength="20" placeholder="Tu nombre de capitán" aria-label="Tu nombre">
      <button id="createBtn" class="btn gold big">Crear partida</button>
      <div class="join-row">
        <input id="codeInput" class="input code" maxlength="4" placeholder="CÓDIGO" aria-label="Código de sala">
        <button id="joinBtn" class="btn gold">Unirse</button>
      </div>
      <p id="homeError" class="error"></p>
    </div>
  </main>

  <main id="lobby" class="lobby hidden"></main>

  <main id="game" class="game hidden">
    <section class="board-wrap">
      <div id="boardView" class="board-view">
        <div id="board" class="board"></div>
      </div>
      <button id="zoomBtn" class="zoom-btn hidden" type="button"></button>
      <div id="actionsFloat" class="actions-float framed hidden"></div>
      <div id="logFloat" class="actions-float log-float framed hidden"></div>
    </section>
    <aside id="panel" class="panel"></aside>
  </main>

  <div id="modal" class="modal hidden"></div>
  <div id="combat" class="modal combat-modal hidden"></div>
  <div id="toasts" class="toasts"></div>
  <div id="handoff" class="handoff hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
